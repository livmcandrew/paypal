<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://js.braintreegateway.com/web/3.134.0/js/three-d-secure.min.js"></script>
    <!-- Braintree core client -->
    <script src="https://js.braintreegateway.com/web/3.134.0/js/client.min.js"></script>
    <!-- PayPal Checkout for Braintree -->
    <script src="https://js.braintreegateway.com/web/3.134.0/js/paypal-checkout.min.js"></script>

    <link rel="stylesheet" href="/styles/styles.css">
    <script src="/scripts/BT/FXaaSScripts.js" defer></script>
    <title>Liv's Site</title>
  </head>
  
  <body>
    <nav class="navbar-y">
      <div class="nav-logo"></div>
      <ul class="nav-list" >
        <a class="nav-links"  href="../../index.html">Home</a>
        <a class="nav-links"  href="dropInUI.html"> Drop-In UI</a>
        <a class="nav-links"  href="hostedFields.html"> Hosted Fields</a>
        <a class="nav-links"  href="Adavnced.html">Advanced</a>
      </ul>
    </nav>

    <div class="box" id="demo-frame">
    <h2> FXaaS</h2>
    <main class="page">
     <div class="checkout-card" id="checkout-message"> 
      <div class="heading">CHECKOUT</div>
      
      <div class="basket">
        <img class="item-image" src="/images/jumper.jpeg"> 
        <div class="purchase">
          <div class="item-text">Cashmere Knitted Jumper</div>
          <div class="item-subtext">S | Black</div>
        </div>
        <div class="purchase-price">
          <div class="item-price">£100</div>
        </div>
      </div>

              
          
          <div class="currency-row">
            <label>Presentment Currency</label>
            <div class="dropdown" id="presentment-currency">
              <button class="dropdown-btn" id="presentment-toggle">
                <span id="selected-presentment">GBP</span>
              </button>
              <div id="presentment-menu" class="dropdown-menu">
                <a class="dropdown-item" data-currency="CAN">CAN</a>
                <a class="dropdown-item" data-currency="EUR">EUR</a>
                <a class="dropdown-item" data-currency="USD">USD</a>
                <a class="dropdown-item" data-currency="GBP">GBP</a>
              </div>
            </div>

            <label>Settlement Currency</label>
            <div class="dropdown" id="settlement-currency">
              <button class="dropdown-btn" id="settlement-toggle">
                <span id="selected-settlement">GBP</span>
              </button>
              <div id="settlement-menu" class="dropdown-menu">
                <a class="dropdown-item" data-currency="CAN">CAN</a>
                <a class="dropdown-item" data-currency="EUR">EUR</a>
                <a class="dropdown-item" data-currency="USD">USD</a>
                <a class="dropdown-item" data-currency="GBP">GBP</a>
              </div>
            </div>
          </div>
          
          <div class="paypal-wrap">
            
            <div class="payment-actions">
            <button class="pay-button"  id="submit-button">Exchange</button>

            <div id="divResponse"></div>
            </div>

          </div>
          
    </div>
  </main>
  </body>
</html>
